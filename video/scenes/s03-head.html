<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<!-- s03 (v2 part 3, why it never gets written down; 15.2 s). Three beats on the narration's sentences (+0.3 s lead):
     0.3  書いて残して、と頼んでも、言葉にはなりません。      → the brush starts 「あの方には、」 and the letters come undone on the paper
     4.6  聞き取りをしても、出てくるのは、一般論ばかりです。  → an interview memo fills with lines that fit any client
     9.4  でも、案を見せられれば、ベテランは一瞬で、「違う」と言えます。 → a draft is shown; the master's 朱 「違う」 lands at once
     (The 51.2% successor statistic of the first cut is not in v2's narration, so it is left out.)
     Colors: 墨, 灰 for the generic memo, 朱 only for the master's 「違う」. Klee (handwritten) for the master's hand. -->
<style>
  /* beat 1 */
  .b1 { animation: fade-out .5s 4.5s ease forwards; }
  .ask { position: absolute; left: 372px; top: 190px; writing-mode: vertical-rl; font-size: 40px; letter-spacing: .14em; opacity: 0; animation: fade .7s .2s ease forwards; }
  .sheet { opacity: 0; animation: fade .6s ease forwards; }
  .brush { animation: brush 4s .8s both; }
  @keyframes brush {
    0%    { opacity: 0; transform: translate(80px, -150px); animation-timing-function: ease-out; }
    10%   { opacity: 1; }
    25%   { opacity: 1; transform: translate(0, -2px); }            /* 1.8 s: touches the paper */
    30%   { transform: translate(0, 0); animation-timing-function: linear; }
    56%   { transform: translate(72px, 164px); }                    /* 3.0 s: six letters written */
    66%   { transform: translate(72px, 164px); animation-timing-function: ease-in-out; }
    86%   { transform: translate(130px, 100px); }
    100%  { opacity: 1; transform: translate(128px, 104px); } }
  .blot { transform-box: fill-box; transform-origin: center; animation: blot .6s 1.8s ease-out both; }
  @keyframes blot { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .w { position: absolute; left: 688px; width: 28px; text-align: center; font-size: 26px; line-height: 28px; writing-mode: vertical-rl; opacity: 0;
    animation: ink .15s var(--a) steps(2, end) forwards, undo 1.2s var(--u) cubic-bezier(.4,0,.6,1) forwards; }
  @keyframes ink { to { opacity: 1; } }
  @keyframes undo { to { opacity: .08; transform: translate(var(--x), var(--y)) rotate(var(--r)); filter: blur(2.2px); } }
  /* beat 2 */
  .memo { position: absolute; left: 380px; top: 150px; width: 520px; padding: 26px 36px 30px; background: #faf9f6; border: 1.5px solid var(--keisen);
    opacity: 0; animation: fade .5s 4.7s ease forwards, fade-out .5s 8.8s ease forwards; }
  .memo h2 { font-size: 17px; font-weight: 400; color: var(--nibi); letter-spacing: .1em; border-bottom: 1px solid var(--keisen); padding-bottom: 8px; }
  .memo p { font-size: 30px; line-height: 1.5; margin-top: 18px; color: var(--nibi); opacity: 0; animation: fade .5s var(--d) ease forwards; }
  .memo .any { font-size: 18px; margin-top: 22px; color: var(--usuzumi); text-align: right; }
  /* beat 3 */
  .draft { position: absolute; left: 330px; top: 150px; width: 560px; padding: 24px 34px 28px; background: #faf9f6; border: 1.5px solid var(--sumi);
    opacity: 0; animation: fade .5s 9.4s ease forwards; }
  .draft h2 { font-size: 17px; font-weight: 400; color: var(--nibi); letter-spacing: .08em; }
  .draft dl { display: grid; grid-template-columns: 4.5em 1fr; row-gap: 14px; margin-top: 16px; font-size: 28px; }
  .draft dt { color: var(--nibi); font-size: 22px; padding-top: 5px; }
  .draft dd { margin: 0; } .draft .x { position: relative; }
  .strike { position: absolute; left: -4px; top: 52%; height: 3px; width: 0; background: var(--shu); animation: strike .25s 12.7s ease-out forwards; }
  @keyframes strike { to { width: calc(100% + 8px); } }
  .no { position: absolute; left: 905px; top: 236px; color: var(--shu); font-family: "Klee", "Hiragino Mincho ProN", serif; font-weight: 600; font-size: 64px;
    transform: rotate(-6deg); clip-path: inset(0 100% 0 0); animation: write .35s 12.8s steps(6, end) forwards; }
  @keyframes write { to { clip-path: inset(0 0 0 0); } }
</style></head>
<body>
<div class="b1">
  <svg width="1280" height="720" viewBox="0 0 1280 720" style="position:absolute;inset:0">
    <g class="sheet">
      <rect x="470" y="190" width="340" height="340" fill="#faf9f6" stroke="var(--keisen)" stroke-width="1.5"/>
      <path stroke="var(--keisen)" stroke-width="1" d="M512,206 V514 M554,206 V514 M596,206 V514 M638,206 V514 M680,206 V514 M722,206 V514 M764,206 V514"/>
    </g>
    <circle class="blot" cx="702" cy="292" r="5" fill="var(--sumi)"/>
    <!-- the brush sits in a group rotated 24°, so moving straight down the column by d is translate(.407d, .914d) -->
    <g transform="translate(702,290) rotate(24)"><g class="brush">
      <path d="M-6,-44 Q-9,-16 0,0 Q9,-16 6,-44 Z" fill="var(--sumi)"/>
      <rect x="-8" y="-62" width="16" height="18" fill="var(--kami-2)" stroke="var(--sumi)" stroke-width="2"/>
      <rect x="-6" y="-230" width="12" height="168" fill="var(--kami)" stroke="var(--sumi)" stroke-width="2"/>
    </g></g>
  </svg>
  <p class="ask">「書いて残して」</p>
  <div id="writing"></div>
</div>
<div class="memo">
  <h2 class="gothic">聞き取りメモ　営業部長</h2>
  <p style="--d:5.3s">お客様を第一に考える</p>
  <p style="--d:6.0s">報告・連絡・相談を大切に</p>
  <p style="--d:6.7s">誠意をもって対応する</p>
  <p class="any gothic" style="--d:7.7s">（どの取引先にも当てはまる）</p>
</div>
<div class="draft">
  <h2 class="gothic">弟子の案　浜風運輸 配車課長 様</h2>
  <dl>
    <dt class="gothic">手段</dt><dd>メール</dd>
    <dt class="gothic">時期</dt><dd><span class="x">遅れが決まってから<span class="strike"></span></span></dd>
    <dt class="gothic">内容</dt><dd>新しい納期のお知らせ</dd>
  </dl>
</div>
<p class="no">違う</p>
<script>
  // Beat 1: the letters the brush writes, and how each one comes undone (fixed values: stills are reproducible).
  const WRITE = "あの方には、", UNDO = [[-9, 6, -14], [12, 10, 18], [-16, 14, -22], [10, 8, 11], [-6, 16, -26], [14, 12, 20]];
  [...WRITE].forEach((ch, i) => {
    const w = document.createElement("div");
    const [x, y, r] = UNDO[i];
    w.className = "w"; w.textContent = ch;
    w.style.cssText = `top:${300 + i * 28}px;--a:${(2.0 + i * 0.2).toFixed(2)}s;--u:${(3.4 + i * 0.09).toFixed(2)}s;--x:${x}px;--y:${y}px;--r:${r}deg`;
    document.getElementById("writing").appendChild(w);
  });
</script>
</body></html>
