<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<!-- 11/5 (運営の回答): Claude Code is labelled as Anthropic's product; the Skill and the MCP server as Kokoroe's; each 根拠 says
     whether it came from the Skill or the MCP server, and the 藍 underline marks what only the MCP server returned.
     s07b (v2 part 7b, 11.5 s; each column appears with its sentence: 0.3 「心得帳は、手元のClaudeにも渡せます。」 → Skill;
     4.2 「育ち続ける心得帳に、問い合わせることもできます。」 → Skill + MCP): the same question to the successor's Claude Code — Skill only (a copy) vs Skill + read-only MCP (the living book).
     Text comes from demo/successor-mcp/answers.json (window.MCP, injected by video/record.ts), recorded with that folder's
     run.sh in empty directories outside the repo. Nothing is typed here by hand. -->
<style>
  .wrap { width: 1160px; }
  .q { font-size: 24px; text-align: center; opacity: 0; animation: fade .6s .1s ease both; }
  .q small { display: block; font-size: 20px; color: var(--sumi); margin-bottom: 8px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 26px; }
  .col { border-top: 3px solid var(--sumi); padding-top: 14px; opacity: 0; animation: fade .7s var(--d) ease both; }
  .col.mcp { border-color: var(--ai); }
  .col h2 { font-size: 20px; font-weight: 600; }
  .col h2 span { font-size: 15px; font-weight: 400; color: var(--nibi); margin-left: 8px; }
  .lead { font-size: 26px; line-height: 1.55; margin-top: 12px; }
  .mcp .lead { color: var(--ai); }
  /* The sentence only the Skill + MCP answer says — marked like a brush underline, appearing a beat after its column. */
  .diff { display: block; width: fit-content; background: linear-gradient(transparent 62%, rgba(43,74,111,.18) 62%); font-weight: 600; padding: 0 2px;
          background-size: 0% 100%; background-repeat: no-repeat; animation: mark .8s 5.4s ease forwards; }
  @keyframes mark { to { background-size: 100% 100%; } }
  .note { font-size: 15px; color: var(--nibi); text-align: center; margin-top: 22px; opacity: 0; animation: fade .6s 6.6s ease both; }
  .why { font-size: 17px; line-height: 1.7; color: var(--nibi); margin-top: 10px; }
  /* Where each part of the answer came from (運営 11/5: which part is Kokoroe's own Skill / MCP server, which is Claude Code). */
  .tag { display: inline-block; font-size: 14px; line-height: 1; padding: 4px 7px; margin-right: 8px; border: 1.5px solid var(--sumi); color: var(--sumi); vertical-align: 2px; }
  .tag.mcp { border-color: var(--ai); color: var(--ai); }
  .note .tag { margin: 0 4px 0 12px; }
  .note .mark { background: linear-gradient(transparent 62%, rgba(43,74,111,.18) 62%); font-weight: 600; color: var(--sumi); }
</style></head>
<body><div class="stage"><div class="wrap">
  <p class="q"><small>後任の手元の <b>Claude Code（Anthropic の既製品）</b>に、同じ質問</small><span id="q"></span></p>
  <div class="cols">
    <div class="col" style="--d:.6s"><h2>Skill だけ<span>ココロエが書き出した Skill（書き出した時点の写し）</span></h2><p class="lead" id="a1"></p><p class="why" id="w1"></p><p class="why" id="x1"></p></div>
    <div class="col mcp" style="--d:4.2s"><h2>Skill ＋ MCP<span>ココロエの MCP サーバー（読み取り専用）で、いまの心得帳を参照</span></h2><p class="lead" id="a2"></p><p class="why" id="w2"></p></div>
  </div>
  <p class="note"><span class="mark">藍の下線</span>＝写しの後の変更（ココロエの MCP サーバーから）<span class="tag">Skill から</span><span class="tag mcp">MCP から</span>＝根拠の出どころ<br>答えの文は、後任役の Claude Code が実際に書いたもの（11/3、抜粋）</p>
</div></div>
<script>
  const M = window.MCP;
  const plain = (s) => s.replace(/\*\*/g, "").replace(/^#+\s*/gm, "");
  const lead = (s) => plain(s.split("\n").find((l) => l.trim()) ?? "");
  // No rule ids on screen (D-053, applied to the video by Kento 11/5): the id only finds the rule's words, then is dropped.
  const ruleText = (s, id) => (plain(s).match(new RegExp((id ?? "K-\\d{3}") + "[^\\n（]*")) ?? [""])[0]
    .replace(/^K-\d{3}\s*[」』）)]?\s*[：:「『（(]?\s*/, "").replace(/[」』]/g, "").replace(/[：:]\s*$/, "").trim().slice(0, 48);
  const rule = (s) => ruleText(s);
  if (M) {
    document.getElementById("q").textContent = M.question;
    const a = M.answers["skill-only"].result, b = M.answers["with-mcp"].result;
    document.getElementById("a1").textContent = lead(a);
    const why = (id, from, text) => { const w = document.getElementById(id); w.innerHTML = '<span class="tag' + (from === "MCP" ? " mcp" : "") + '">' + from + ' から</span>'; w.append("根拠: " + text); };
    why("w1", "Skill", rule(a));
    // What the copy does not know, as the recorded answer says it (judge-critic 11/6: without it both leads read "not enough").
    const unknown = (plain(a).match(/師匠に確認してほしいこと\s*\n\s*-\s*([^\n]+)/) ?? [])[1];
    if (unknown) document.getElementById("x1").textContent = "心得帳に記録なし → 師匠に確認: " + unknown.trim();
    // Mark the sentences of the MCP lead that the Skill-only answer doesn't say (most of their 2-character pieces are new).
    const pairs = (t) => new Set([...t].slice(1).map((c, i) => t[i] + c));
    const seen = pairs(plain(a));
    const a2 = document.getElementById("a2");
    for (const sent of lead(b).match(/[^。]+。?/g) ?? []) {
      const ps = [...pairs(sent.trim().replace(/[、。\s]/g, ""))];
      const fresh = ps.filter((p) => !seen.has(p)).length / Math.max(1, ps.length);
      const el = document.createElement("span");
      el.textContent = fresh >= 0.5 ? sent.trim() : sent;
      if (fresh >= 0.5 && a2.childNodes.length) a2.append(" ");
      if (fresh >= 0.5) el.className = "diff";
      a2.append(el);
    }
    const added = (plain(b).match(/K-\d{3}/g) ?? []).find((k) => !plain(a).includes(k));
    // The right answer's first rule is the one only the MCP server knows (added after the copy) when there is one.
    const first = (plain(b).match(/K-\d{3}/) ?? [""])[0];
    why("w2", first && first === added ? "MCP" : "Skill", rule(b));
  }
</script></body></html>
