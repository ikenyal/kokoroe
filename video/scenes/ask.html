<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<!-- ask (v3): a question between parts, to pull the viewer into the next one (Kento 11/4). The text is the narration itself, so
     the scene has no subtitle. Which question is chosen by the URL's hash (scenes.json: ask.html#noren, ask.html#why).
     Ink on paper, an indigo rule drawn under it; nothing else. -->
<style>
  .q { text-align: center; font-size: 50px; line-height: 1.7; letter-spacing: .08em; opacity: 0; animation: fade .7s .2s ease forwards; }
  .rule { width: 0; height: 2px; margin: 34px auto 0; background: var(--ai); animation: grow 1.4s .8s ease-out forwards; }
  @keyframes grow { to { width: 360px; } }
</style></head>
<body><div class="stage"><div><p class="q" id="q"></p><div class="rule"></div></div></div>
<script>
  const Q = {
    noren: "では、部長がいなくなったあと、<br>後任は、答えられるのでしょうか。",
    why: "直すだけで、本当に、<br>伝わるのでしょうか。",
  };
  document.getElementById("q").innerHTML = Q[location.hash.slice(1)] ?? "";
</script>
</body></html>
