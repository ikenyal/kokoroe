<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<!-- s01 (v6, why now — two forces, each one moving; 13.0 s. Kento 11/6 item 24: the AI sentence and its panel were cut so the
     real screens come sooner; the seconds went to s05). Panels open with the narration's sentences (+0.15 s lead):
     0.15 中小企業の半数あまりで、跡継ぎが決まっていません。 → the number counts up to 51.2%; a tag hangs on half of the companies
          (帝国データバンク「全国『後継者不在率』動向調査（2025年）」, of the small and medium firms surveyed)
     4.6  仕事を変える人は、一年に三百三十万人。 → people walk out one after another through a noren; 330万人 counts up; 異動も
          (総務省統計局「労働力調査（詳細集計）2025年（令和7年）平均結果」, 転職者数; job transfers have no clear public figure)
     9.0  頭の中にしかない知恵を、いま、渡せる形に。 → the panels step back; the conclusion in ink
     Numbers count with CSS (@property integers), so stills can stop at any moment. Colors: 墨, 藍; no 朱 (no master here). -->
<style>
  @property --n { syntax: "<integer>"; inherits: false; initial-value: 0; }
  .panels { position: absolute; left: 216px; top: 84px; zoom: 1.08; display: grid; grid-template-columns: repeat(2, 360px); gap: 30px;
    animation: back .7s 8.9s ease forwards; }
  @keyframes back { to { opacity: 0; transform: translateY(-14px); } }
  .p { height: 470px; border-top: 3px solid var(--sumi); padding-top: 12px; opacity: 0; animation: fade .5s var(--d) ease forwards; }
  .stage2 { position: relative; height: 230px; overflow: hidden; }
  .what { font-size: 22px; line-height: 1.5; margin-top: 14px; }
  .what .also { color: var(--ai); opacity: 0; animation: fade .4s 7.2s ease forwards; }
  .num { font-size: 58px; line-height: 1.15; color: var(--ai); font-variant-numeric: tabular-nums; }
  .num.words { font-size: 34px; line-height: 1.6; }
  .src { font-size: 14px; line-height: 1.5; color: var(--nibi); margin-top: 6px; }
  .count { counter-reset: n var(--n); }
  .count::before { content: counter(n); }
  .c51 { animation: c51 1.6s .5s cubic-bezier(.2,.6,.3,1) forwards; }
  @keyframes c51 { to { --n: 51; } }
  .dec { display: inline-block; max-width: 0; overflow: hidden; vertical-align: bottom; animation: open .25s 2.1s ease-out forwards; }
  @keyframes open { to { max-width: 1.4em; } }
  .c330 { animation: c330 1.5s 5.0s cubic-bezier(.2,.6,.3,1) forwards; }
  @keyframes c330 { to { --n: 330; } }

  /* panel 1: ten companies; a tag hangs on five */
  .co { position: absolute; width: 56px; height: 56px; }
  .co svg { overflow: visible; }
  .tagc { position: absolute; left: 34px; top: -6px; transform-origin: 6px 0; opacity: 0; animation: hang .9s var(--t) cubic-bezier(.3,.7,.4,1) forwards; }
  .tagc i { display: block; width: 1px; height: 16px; margin-left: 6px; background: var(--ai); }
  .tagc b { display: block; width: 14px; height: 24px; border: 1.4px solid var(--ai); background: #faf9f6; }
  @keyframes hang { 0% { opacity: 0; transform: translateY(-14px) rotate(14deg); } 40% { opacity: 1; } 70% { transform: rotate(-6deg); } to { opacity: 1; transform: none; } }

  /* panel 2: people walk out through the noren */
  .noren { position: absolute; left: 236px; top: 26px; width: 100px; height: 150px; z-index: 2; }
  .noren .bar { position: absolute; left: -10px; right: -10px; top: 0; height: 6px; background: var(--sumi); border-radius: 3px; }
  .noren .flap { position: absolute; top: 6px; width: 31px; height: 140px; background: var(--ai); transform-origin: top center;
    animation: sway 4.0s 5.0s ease-in-out; }
  .noren .flap:nth-child(2) { left: 0; } .noren .flap:nth-child(3) { left: 34px; animation-delay: 5.2s; } .noren .flap:nth-child(4) { left: 68px; animation-delay: 5.4s; }
  @keyframes sway { 10%, 30%, 50%, 70%, 90% { transform: skewX(-7deg); } 20%, 40%, 60%, 80% { transform: skewX(4deg); } }
  .walker { position: absolute; left: -40px; top: 92px; opacity: 0; animation: walk 1.7s var(--t) linear forwards; }
  @keyframes walk { 0% { opacity: 1; transform: translateX(0); } 100% { opacity: 1; transform: translateX(330px); } }
  .walker svg { overflow: visible; animation: bob .34s var(--t) 5 ease-in-out; }
  @keyframes bob { 50% { transform: translateY(-4px); } }


  .end { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-size: 46px; letter-spacing: .1em; line-height: 1.7;
    opacity: 0; animation: fade .8s 9.1s ease forwards; }
  .end .now { color: var(--ai); }
</style></head>
<body>
<p class="corner-note gothic">なぜ、いま</p>
<div class="panels">
  <div class="p" style="--d:.3s">
    <div class="stage2" id="cos"></div>
    <p class="what">跡継ぎが決まっていない中小企業</p>
    <p class="num"><span class="count c51"></span><span class="dec">.2</span>%</p>
    <p class="src gothic">出典：帝国データバンク「全国『後継者不在率』動向調査（2025年）」、調査対象の中小企業</p>
  </div>
  <div class="p" style="--d:4.6s">
    <div class="stage2" id="walk">
      <div class="noren"><div class="bar"></div><div class="flap"></div><div class="flap"></div><div class="flap"></div></div>
    </div>
    <p class="what">1年のあいだに仕事を変えた人</p>
    <p class="num"><span class="count c330"></span>万人</p>
    <p class="src gothic">出典：総務省統計局「労働力調査（詳細集計）2025年平均結果」、転職者数</p>
    <!-- judge-critic 11/6: kept apart from the number (in-house transfers have no public figure and are not in the 330万) -->
    <p class="what" style="margin-top:10px;font-size:19px;white-space:nowrap"><span class="also">（このほか、異動も当たり前に）</span></p>
  </div>
</div>
<p class="end">頭の中にしかない知恵を、<br><span class="now">いま</span>、渡せる形に。</p>
<script>
  // Panel 1: ten companies in two rows; every other one gets a tag (5 of 10 ≈ 51.2%), one after another.
  const cos = document.getElementById("cos");
  for (let i = 0; i < 10; i++) {
    const c = document.createElement("div");
    c.className = "co";
    c.style.left = 14 + (i % 5) * 68 + "px"; c.style.top = 36 + Math.floor(i / 5) * 96 + "px";
    c.innerHTML = '<svg width="46" height="56" viewBox="0 0 46 56"><path d="M4,54 V22 L23,8 L42,22 V54 Z M16,54 V38 H30 V54" fill="#faf9f6" stroke="var(--sumi)" stroke-width="1.6" stroke-linejoin="round"/></svg>';
    if ([0, 2, 4, 6, 8].includes(i)) c.innerHTML += `<span class="tagc" style="--t:${(2.2 + [0, 2, 4, 6, 8].indexOf(i) * 0.22).toFixed(2)}s"><i></i><b></b></span>`;
    cos.appendChild(c);
  }
  // Panel 2: five people walk out through the noren, one after another.
  const walk = document.getElementById("walk");
  for (let i = 0; i < 5; i++) {
    const w = document.createElement("div");
    w.className = "walker"; w.style.setProperty("--t", (4.9 + i * 0.75).toFixed(2) + "s");
    w.innerHTML = '<svg width="30" height="70" viewBox="0 0 30 70"><circle cx="15" cy="10" r="8" fill="var(--sumi)"/><path d="M5,70 V34 Q5,22 15,22 Q25,22 25,34 V70 Z" fill="var(--sumi)"/></svg>';
    walk.appendChild(w);
  }
</script>
</body></html>
