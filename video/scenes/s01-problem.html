<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<!-- s01 (v2 part 1, the problem; 16.8 s). Timed to the narration's sentences (+0.3 s lead; video/out/audio/Takumi/s01-problem.marks.json):
     0.3  来年の春、営業部長が退職します。            → the sales director, drawn from behind
     4.2  三十年、取引先とのやりとりを見てきた人です。  → the client ledger opens; the clients' names are written column by column
     8.5  どの取引先に、何を、どう伝えるか。            → 「誰に」「何を」「どう」 appear under the ledger, in indigo
     12.7 その作法は、部長の頭の中にしかありません。    → those three words move into his head; the ledger keeps only the names
     Names are the fictional clients of data/world/clients.json. Colors: 墨, 藍 (no 朱: the master has not corrected anything yet). -->
<style>
  .person .draw { --t: 2.2s; }
  .who { position: absolute; left: 820px; top: 590px; width: 170px; text-align: center; font-size: 19px; color: var(--nibi); letter-spacing: .08em;
    opacity: 0; animation: fade .8s 1.8s ease forwards; }
  .book { opacity: 0; animation: fade .8s 4.2s ease forwards, dim 1.2s 13s ease forwards; }
  @keyframes dim { to { opacity: .45; } }
  .name { position: absolute; top: 186px; writing-mode: vertical-rl; font-size: 25px; letter-spacing: .18em; line-height: 1;
    clip-path: inset(0 0 100% 0); animation: write .5s var(--d) steps(6, end) forwards, dim 1.2s 13s ease forwards; }
  @keyframes write { to { clip-path: inset(0 0 0 0); } }
  .q { position: absolute; top: 520px; font-size: 38px; color: var(--ai); letter-spacing: .1em; opacity: 0; transform-origin: center;
    animation: fade .5s var(--d) ease forwards, into 1.6s var(--m) cubic-bezier(.45,.05,.3,1) forwards; }
  @keyframes into { to { transform: translate(var(--dx), var(--dy)) scale(.48); } }
  .ring { opacity: 0; animation: fade 1s 14.2s ease forwards; }
</style></head>
<body>
<p class="corner-note gothic">架空の会社・だいだい工房</p>
<svg width="1280" height="720" viewBox="0 0 1280 720" style="position:absolute;inset:0">
  <!-- the client ledger, open -->
  <g class="book">
    <path d="M150,150 H380 Q390,156 400,150 H630 V500 H400 Q390,506 380,500 H150 Z" fill="#faf9f6" stroke="var(--sumi)" stroke-width="2"/>
    <path class="ink thin" d="M390,154 V502"/>
  </g>
  <!-- the sales director, from behind (head, ears, collar, shoulders, arms) -->
  <g class="person">
    <ellipse class="ink draw" pathLength="1" style="--d:.3s" cx="905" cy="250" rx="54" ry="64"/>
    <path class="ink draw" pathLength="1" style="--d:.7s" d="M851,246 Q842,252 849,266 M959,246 Q968,252 961,266"/>
    <path class="ink draw" pathLength="1" style="--d:.9s" d="M792,570 Q796,404 862,366 L884,318 Q905,330 926,318 L948,366 Q1014,404 1018,570"/>
    <path class="ink draw thin" pathLength="1" style="--d:1.4s" d="M880,328 Q905,342 930,328 M905,342 V570 M840,430 Q830,500 834,570 M970,430 Q980,500 976,570"/>
    <path class="ink draw thin" pathLength="1" style="--d:1.1s" d="M872,301 Q905,314 938,301"/>
  </g>
  <ellipse class="ring" cx="905" cy="250" rx="76" ry="86" fill="none" stroke="var(--ai)" stroke-width="1.4" stroke-dasharray="3 7"/>
</svg>
<p class="who gothic" style="left:975px;top:160px;width:auto">営業部長</p>
<div id="names"></div>
<p class="q" style="left:190px;--d:8.7s;--m:12.9s;--dx:675px;--dy:-338px">誰に</p>
<p class="q" style="left:330px;--d:9.5s;--m:13.1s;--dx:535px;--dy:-308px">何を</p>
<p class="q" style="left:470px;--d:10.4s;--m:13.3s;--dx:395px;--dy:-278px">どう</p>
<script>
  // Clients from data/world/clients.json (fictional), right → left like a ledger; one column each, written in turn.
  const NAMES = ["浜風運輸", "白樺製菓", "港北精機", "丸新酒造", "県産業振興財団", "大河原建材", "青葉ドラッグ", "ネクストリンク"];
  const X = [580, 530, 480, 430, 340, 290, 240, 190];
  NAMES.forEach((n, i) => {
    const el = document.createElement("p");
    el.className = "name"; el.textContent = n;
    el.style.cssText = `left:${X[i] - 13}px;--d:${(4.6 + i * 0.42).toFixed(2)}s`;
    document.getElementById("names").appendChild(el);
  });
</script>
</body></html>
