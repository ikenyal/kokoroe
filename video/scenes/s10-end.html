<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<!-- s10 (10 s): end card. Title, subtitle, repository URL (as it will be when public), fictional-data note. No subtitle overlay. -->
<style>
  .card { text-align: center; }
  .title { font-size: 76px; letter-spacing: .06em; opacity: 0; animation: fade 1.2s .2s ease both; }
  .title .ja { letter-spacing: .14em; }
  .rule { width: 0; height: 2px; background: var(--sumi); margin: 30px auto 28px; animation: grow 1.2s 1s ease both; }
  @keyframes grow { to { width: 560px; } }
  .sub { font-size: 34px; letter-spacing: .1em; opacity: 0; animation: fade 1.2s 1.6s ease both; }
  .url { margin-top: 64px; font-size: 26px; color: var(--ai); letter-spacing: .02em; opacity: 0; animation: fade 1s 3s ease both; }
  .note { margin-top: 22px; font-size: 20px; color: var(--nibi); opacity: 0; animation: fade 1s 3.8s ease both; }
</style></head>
<body><div class="stage"><div class="card">
  <p class="title">Kokoroe<span class="ja">（心得）</span></p>
  <div class="rule"></div>
  <p class="sub">商いの心得を継ぐ、AIの弟子</p>
  <p class="url gothic">https://github.com/ikenyal/kokoroe</p>
  <p class="note gothic">登場する会社・人物はすべて架空です</p>
</div></div></body></html>
