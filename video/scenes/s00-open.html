<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<!-- s00 (v4 cold open, 12.8 s): a difference you can see, a reason you can't. On the narration's sentences (+0.3 s lead):
     0.3  ほとんど同じ、2通の連絡。         → two messages to 丸新酒造 slide in from left and right; the right one has one more line
     3.3  違いは、たった1行。               → the master's 朱 brush circles that line (a correction's gesture)
     5.0  でも、この1行がなぜ要るのか、知っているのは、来年の春に辞める部長だけです。
                                          → the line glows and is drawn into the head of the director's profile; a 「来春 退職」
                                            tag drops beside him
     The extra line is the word to the 蔵元 of the demo (T05 → T13); s05 帳場 says so (「冒頭の1行は、蔵元への、裏の一言でした。」).
     Colors: 墨, 藍 (the glow), 朱 (only the master's circle). Faces: Mincho; the tag in Mincho on paper. -->
<style>
  .card { position: absolute; top: 236px; width: 500px; padding: 22px 30px 26px; background: #faf9f6; border: 1.5px solid var(--sumi);
    font-size: 21px; line-height: 1.95; transform-origin: left center; }
  .card .h { font-size: 15px; color: var(--nibi); letter-spacing: .06em; margin-bottom: 6px; }
  .l { left: 100px; animation: inL .8s .2s cubic-bezier(.2,.7,.3,1) both, aside .8s 6.0s ease-in-out forwards; }
  .r { left: 680px; animation: inR .8s .2s cubic-bezier(.2,.7,.3,1) both, aside .8s 6.0s ease-in-out forwards; }
  @keyframes inL { from { opacity: 0; transform: translateX(-260px); } to { opacity: 1; transform: none; } }
  @keyframes inR { from { opacity: 0; transform: translateX(260px); } to { opacity: 1; transform: none; } }
  @keyframes aside { to { opacity: .35; transform: translateX(-250px) scale(.86); } }
  .extra { position: relative; display: inline-block; }
  .extra.lit { animation: lit .6s 5.2s ease forwards; }
  @keyframes lit { to { color: var(--ai); text-shadow: 0 0 10px rgba(43,74,111,.45); } }
  .circle { position: absolute; left: -16px; top: -10px; overflow: visible; }
  .circle path { fill: none; stroke: var(--shu); stroke-width: 3.2; stroke-linecap: round; }
  /* the line that travels: a copy laid exactly over the right card's extra line (positions set by the script below) */
  .fly { position: absolute; font-size: 21px; line-height: 1.95; white-space: nowrap; color: var(--ai); text-shadow: 0 0 12px rgba(43,74,111,.55);
    opacity: 0; transform-origin: left center;
    animation: show .01s 6.8s forwards, fly 1.4s 7.1s cubic-bezier(.5,0,.3,1) forwards; }
  @keyframes show { to { opacity: 1; } }
  @keyframes fly { 70% { opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.12); opacity: 0; } }
  .who { opacity: 0; animation: fade .8s 5.9s ease forwards; }
  .glow { opacity: 0; animation: glow 1.4s 8.2s ease forwards; }
  @keyframes glow { 40% { opacity: .9; } to { opacity: .5; } }
  /* the tag drops on its string and swings to rest */
  .tag { position: absolute; left: 1204px; top: -260px; width: 54px; transform-origin: 27px -40px; animation: drop 1.6s 9.6s cubic-bezier(.3,.7,.4,1) forwards; }
  .tag .str { position: absolute; left: 26px; top: -300px; width: 1.5px; height: 300px; background: var(--sumi); }
  .tag .f { position: relative; padding: 12px 0; background: #faf9f6; border: 1.8px solid var(--sumi); writing-mode: vertical-rl; font-size: 22px;
    letter-spacing: .2em; text-align: center; line-height: 52px; }
  @keyframes drop { 0% { transform: translateY(0) rotate(0); } 45% { transform: translateY(560px) rotate(7deg); }
    65% { transform: translateY(540px) rotate(-4deg); } 82% { transform: translateY(552px) rotate(2deg); } to { transform: translateY(548px) rotate(0); } }
</style></head>
<body>
<div class="card l">
  <p class="h gothic">丸新酒造　蔵元の奥様</p>
  <p>いつもお世話になっております。</p>
  <p>新しい集計の仕組みを、ご提案します。</p>
  <p>来週、資料をお持ちします。</p>
</div>
<div class="card r">
  <p class="h gothic">丸新酒造　蔵元の奥様</p>
  <p>いつもお世話になっております。</p>
  <p>新しい集計の仕組みを、ご提案します。</p>
  <p>来週、資料をお持ちします。</p>
  <p><span class="extra lit" id="extra">蔵元様にも、ひとことご挨拶に伺います。
    <svg class="circle" width="420" height="62" viewBox="0 0 420 62"><path class="draw" pathLength="1" style="--d:3.4s;--t:.75s"
      d="M30,10 C120,-2 330,0 404,16 C428,28 404,52 300,56 C190,60 40,58 12,42 C-6,30 8,12 52,6"/></svg></span></p>
</div>
<p class="fly" id="fly">蔵元様にも、ひとことご挨拶に伺います。</p>
<svg class="who" width="1280" height="720" viewBox="0 0 1280 720" style="position:absolute;inset:0">
  <g transform="translate(355,-10)">
    <!-- the director in profile (the end card's line), facing left toward the messages -->
    <path d="M560,620 Q580,520 652,496 L652,460 Q632,452 628,434 L622,424 Q626,416 620,410 L626,398 Q614,386 610,372
      L626,358 Q626,336 632,320 Q646,220 740,216 Q826,220 834,312 Q838,392 796,440 L792,496 Q870,514 900,620"
      fill="var(--kami-2)" stroke="var(--sumi)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle class="glow" cx="740" cy="300" r="46" fill="rgba(43,74,111,.16)" stroke="var(--ai)" stroke-width="1.2" stroke-dasharray="3 6"/>
  </g>
</svg>
<div class="tag"><div class="str"></div><div class="f">来春　退職</div></div>
<script>
  // Lay the travelling copy exactly over the extra line (layout positions; transforms ignored), then aim it at the head.
  const extra = document.getElementById("extra"), fly = document.getElementById("fly"), card = extra.closest(".card");
  let x = 0, y = 0;
  for (let el = extra; el && el !== document.body; el = el.offsetParent) { x += el.offsetLeft; y += el.offsetTop; }
  // the cards move aside (translateX -250px, scale .86 about their left edge) before the copy leaves
  const cx = card.offsetLeft, cy = card.offsetTop + card.offsetHeight / 2;
  const sx = cx - 250 + (x - cx) * 0.86, sy = cy + (y - cy) * 0.86;
  fly.style.left = sx + "px"; fly.style.top = sy + "px"; fly.style.fontSize = 21 * 0.86 + "px";
  fly.style.setProperty("--dx", 1095 - sx + "px"); fly.style.setProperty("--dy", 290 - sy + "px");
</script>
</body></html>
