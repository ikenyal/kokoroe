<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<!-- s04b (v5, the flow in one picture, and what the words mean; 9.7 s). On the narration's two sentences (+0.15 s lead):
     0.15 師匠は、○△×と一言だけ。                              → 弟子 → 案 → 師匠: ○ △ × and a one-liner in 朱 (above him)
     4.6  その一つ一つが心得になり、経緯ごと、心得帳に綴られます。 → 心得帳 → 後任; the two words are defined on screen (D-052):
          心得 = one piece of the master's practice; 心得帳 = those, written down with why they came to be.
     The one-liner is the demo's own (s05: 「裏で蔵元に一言」). 朱 only for the master's marks. -->
<style>
  .node { position: absolute; top: 210px; width: 210px; height: 170px; padding-top: 26px; text-align: center; background: #faf9f6;
    border: 2px solid var(--sumi); opacity: 0; animation: fade .45s var(--d) ease forwards; }
  .node h2 { font-size: 36px; font-weight: 600; letter-spacing: .12em; }
  .node p { font-size: 17px; color: var(--nibi); margin-top: 8px; line-height: 1.5; }
  .node.book { border-color: var(--ai); }
  .node.book h2 { color: var(--ai); }
  .arrow { position: absolute; top: 293px; height: 2px; background: var(--sumi); transform-origin: left; transform: scaleX(0);
    animation: grow .4s var(--d) ease-out forwards; }
  .arrow::after { content: ""; position: absolute; right: -2px; top: -6px; border-left: 12px solid var(--sumi); border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
  @keyframes grow { to { transform: scaleX(1); } }
  .tag { position: absolute; top: 252px; width: 90px; text-align: center; font-size: 19px; opacity: 0; animation: fade .4s var(--d) ease forwards; }
  .marks { position: absolute; left: 375px; top: 112px; width: 210px; text-align: center; font-size: 40px; color: var(--shu); letter-spacing: .3em; }
  .marks span { opacity: 0; animation: fade .3s var(--d) ease forwards; }
  .say { position: absolute; left: 340px; top: 166px; width: 280px; text-align: center; color: var(--shu); font-family: "Klee", "Hiragino Mincho ProN", serif;
    font-weight: 600; font-size: 24px; clip-path: inset(0 100% 0 0); animation: write .7s 2.7s steps(10, end) forwards; }
  @keyframes write { to { clip-path: inset(0 0 0 0); } }
  /* 既製 vs 自作 (運営 11/5): the apprentice's words are written by Claude's API (off the shelf); the 心得帳 and how it is kept
     are Kokoroe's own. Dashed = off the shelf, solid 藍 = made here. */
  .chip { position: absolute; top: 392px; width: 300px; margin-left: -45px; white-space: nowrap; text-align: center; font-size: 16px; opacity: 0; animation: fade .4s var(--d) ease forwards; }
  .chip span { display: inline-block; padding: 3px 10px; border: 1.5px dashed var(--nibi); color: var(--nibi); }
  .chip.own span { border: 1.5px solid var(--ai); color: var(--ai); }
  .defs { position: absolute; left: 240px; top: 448px; width: 800px; padding: 18px 30px; border-top: 1.5px solid var(--keisen); border-bottom: 1.5px solid var(--keisen);
    display: grid; grid-template-columns: 5em 1fr; row-gap: 10px; font-size: 24px; line-height: 1.5; opacity: 0; animation: fade .4s 4.9s ease forwards; }
  .defs dt { font-weight: 600; opacity: 0; animation: fade .45s var(--d) ease forwards; }
  .defs dd { margin: 0; opacity: 0; animation: fade .45s var(--d) ease forwards; }
  .defs .b { color: var(--ai); }
</style></head>
<body>
<div class="node" style="left:70px;--d:.1s"><h2>弟子</h2><p class="gothic">AI（橙丸）<br>先に案を出す</p></div>
<p class="chip gothic" style="left:70px;--d:.4s"><span>文面は Claude の API（既製）</span></p>
<div class="arrow" style="left:282px;width:90px;--d:.5s"></div><p class="tag gothic" style="left:282px;--d:.6s">案</p>
<div class="node" style="left:375px;--d:.7s"><h2>師匠</h2><p class="gothic">営業部長<br>直すだけ</p></div>
<p class="marks"><span style="--d:1.4s">○</span><span style="--d:1.7s">△</span><span style="--d:2.0s;font-size:48px">×</span></p>
<p class="say">「裏で蔵元に一言」</p>
<div class="arrow" style="left:587px;width:90px;--d:4.6s"></div>
<div class="node book" style="left:680px;--d:4.8s"><h2>心得帳</h2><p class="gothic">心得を、経緯ごと<br>綴ったもの</p></div>
<p class="chip own gothic" style="left:680px;--d:5.0s"><span>ココロエが作った仕組み</span></p>
<div class="arrow" style="left:892px;width:90px;--d:7.4s"></div>
<div class="node" style="left:985px;--d:7.6s"><h2>後任</h2><p class="gothic">引き継ぐ人<br>読んで、聞ける</p></div>
<dl class="defs">
  <dt style="--d:5.0s">心得</dt><dd style="--d:5.0s">師匠の作法の、一つ一つ</dd>
  <dt class="b" style="--d:6.3s">心得帳</dt><dd style="--d:6.3s">それを、なぜそうなったかと一緒に綴ったもの</dd>
</dl>
</body></html>
