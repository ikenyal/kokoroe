<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<!-- s04b (v2 part 4b, the flow in one picture; 11.5 s). On the narration's two sentences (+0.3 s lead):
     0.3  師匠は、弟子の案に、○△×と、一言だけ。       → 弟子 (the AI apprentice) → 案 → 師匠: ○ △ × and a one-liner in 朱
     6.5  作法は、経緯ごと心得帳に残り、後任へ渡せます。 → 心得帳 (the practice, with when and why) → 後任
     A dotted line under it: the apprentice reads the 心得帳 for its next draft (the loop; not narrated, shown quietly).
     The one-liner is the demo's own (s05: 「裏で蔵元に一言」). 朱 only for the master's marks. -->
<style>
  .node { position: absolute; top: 210px; width: 210px; height: 190px; padding-top: 30px; text-align: center; background: #faf9f6;
    border: 2px solid var(--sumi); opacity: 0; animation: fade .5s var(--d) ease forwards; }
  .node h2 { font-size: 36px; font-weight: 600; letter-spacing: .12em; }
  .node p { font-size: 17px; color: var(--nibi); margin-top: 8px; line-height: 1.5; }
  .node.book { border-color: var(--ai); }
  .node.book h2 { color: var(--ai); }
  .arrow { position: absolute; top: 303px; height: 2px; background: var(--sumi); transform-origin: left; transform: scaleX(0);
    animation: grow .45s var(--d) ease-out forwards; }
  .arrow::after { content: ""; position: absolute; right: -2px; top: -6px; border-left: 12px solid var(--sumi); border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
  @keyframes grow { to { transform: scaleX(1); } }
  .tag { position: absolute; top: 262px; width: 90px; text-align: center; font-size: 19px; opacity: 0; animation: fade .4s var(--d) ease forwards; }
  .marks { position: absolute; left: 375px; top: 420px; width: 210px; text-align: center; font-size: 40px; color: var(--shu); letter-spacing: .3em; }
  .marks span { opacity: 0; animation: fade .3s var(--d) ease forwards; }
  .say { position: absolute; left: 340px; top: 482px; width: 280px; text-align: center; color: var(--shu); font-family: "Klee", "Hiragino Mincho ProN", serif;
    font-weight: 600; font-size: 26px; clip-path: inset(0 100% 0 0); animation: write .8s 4.0s steps(10, end) forwards; }
  @keyframes write { to { clip-path: inset(0 0 0 0); } }
  .keep { position: absolute; left: 655px; top: 136px; width: 250px; text-align: center; font-size: 19px; line-height: 1.7; color: var(--ai);
    opacity: 0; animation: fade .5s 7.4s ease forwards; }
  .loop { opacity: 0; animation: fade .8s 9.6s ease forwards; }
  .loop-label { position: absolute; left: 330px; top: 556px; width: 300px; text-align: center; font-size: 16px; color: var(--nibi);
    opacity: 0; animation: fade .8s 9.8s ease forwards; }
</style></head>
<body>
<div class="node" style="left:70px;--d:.3s"><h2>弟子</h2><p class="gothic">AI（橙丸）<br>先に案を出す</p></div>
<div class="arrow" style="left:282px;width:90px;--d:1.1s"></div><p class="tag gothic" style="left:282px;--d:1.2s">案</p>
<div class="node" style="left:375px;--d:1.4s"><h2>師匠</h2><p class="gothic">営業部長<br>直すだけ</p></div>
<p class="marks"><span style="--d:2.4s">○</span><span style="--d:2.75s">△</span><span style="--d:3.1s;font-size:48px">×</span></p>
<p class="say">「裏で蔵元に一言」</p>
<div class="arrow" style="left:587px;width:90px;--d:6.6s"></div>
<div class="node book" style="left:680px;--d:6.9s"><h2>心得帳</h2><p class="gothic">直された作法</p></div>
<p class="keep gothic">いつ・なぜ変わったか<br>（経緯）も一緒に</p>
<div class="arrow" style="left:892px;width:90px;--d:8.6s"></div>
<div class="node" style="left:985px;--d:8.9s"><h2>後任</h2><p class="gothic">引き継ぐ人<br>読んで、聞ける</p></div>
<svg class="loop" width="1280" height="720" viewBox="0 0 1280 720" style="position:absolute;inset:0">
  <path d="M785,402 Q785,540 480,540 Q175,540 175,408" fill="none" stroke="var(--ai)" stroke-width="1.6" stroke-dasharray="4 6"/>
  <path d="M168,418 L175,404 L182,418" fill="none" stroke="var(--ai)" stroke-width="1.6"/>
</svg>
<p class="loop-label gothic">弟子は、心得帳を読んで次の案を出す</p>
</body></html>
