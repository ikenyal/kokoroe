<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<!-- s08 (v5, why it works; 10.9 s; times below are v3's, now about 0.6 s earlier (narration 「AIが出すのは、平均的な答えです。…」); the question 「直すだけで、本当に、弟子は育つのでしょうか。」 (Kento 11/6; was 「伝わる」) is asked just before, in s07c-ask).
     On the narration's sentences (+0.3 s lead):
     0.3  AIは、平均的な答えを出すのが得意です。 → the AI's draft, labelled as the average answer (it would fit any client)
     4.4  ベテランの知恵は、その平均との、ずれにあります。 → the master's 朱 correction on that draft: the gap from the average
     9.0  だから、ずれだけを集めればいい。 → (from 6.2 s) the corrections settle onto the ruled ledger and become the kokoroe-chō
     The ledger part was s09a of the first cut (text only, Kento 11/4): just before the numbers.
     The letters' job: the master's one-liners settle onto the ruled lines and *become* the kokoroe-chō.
     Each spoken one-liner appears in vermilion (the master's hand), lands at the head of a column as a small note, and the
     rule it became is written below it in ink; columns fill right → left like a merchant's ledger (vertical writing).
     Words and rules are from the demo's kokoroe-chō (data/demo/demo-snapshot.json: K-016, K-015, K-014; fictional).
     Colors: 墨, 朱 (and the ruled lines). Faces: Mincho for the ledger, Klee (handwritten) for the master's words. -->
<style>
  .page { position: absolute; left: 400px; top: 70px; width: 560px; height: 520px; background: #faf9f6;
    border: 1.5px solid var(--keisen); opacity: 0; animation: fade .7s 5.6s ease forwards; }
  .ledger { position: absolute; inset: 24px 28px; writing-mode: vertical-rl; font-size: 22px; line-height: 38px; letter-spacing: .06em;
    background: repeating-linear-gradient(to left, transparent 0 37px, var(--keisen) 37px 38px); }
  .head { font-size: 30px; line-height: 76px; letter-spacing: .3em; background: #faf9f6; opacity: 0; animation: fade .7s 5.8s ease forwards; }
  .head small { font-size: 17px; letter-spacing: .1em; color: var(--nibi); margin-top: 18px; }
  .entry { display: block; clip-path: inset(0 0 100% 0); } /* revealed column by column, top → bottom (script below) */
  .entry .note { color: var(--shu); font-family: "Klee", "Hiragino Mincho ProN", serif; font-weight: 600; font-size: 18px; opacity: 0;
    animation: fade .01s var(--land) forwards; }
  /* the spoken one-liner: appears large at the left, then flies to its column head */
  .said { position: absolute; left: 0; top: 0; color: var(--shu); font-family: "Klee", "Hiragino Mincho ProN", serif; font-weight: 600;
    font-size: 34px; white-space: nowrap; writing-mode: vertical-rl; opacity: 0; transform-origin: left top; transform: translate(var(--sx), var(--sy));
    animation: say .3s var(--s) ease forwards, land .5s var(--f) cubic-bezier(.45,.05,.3,1) forwards; }
  @keyframes say { to { opacity: 1; } }
  @keyframes land { to { transform: translate(var(--tx), var(--ty)) scale(.53); opacity: 0; } }
  /* the average answer and the master's correction (before the ledger) */
  .avg { position: absolute; left: 330px; top: 200px; width: 620px; padding: 26px 36px 66px; background: #faf9f6; border: 1.5px solid var(--usuzumi);
    font-size: 27px; line-height: 1.75; opacity: 0; animation: fade .5s .1s ease forwards, fade-out .5s 5.4s ease forwards; }
  .avg .h { font-size: 16px; color: var(--nibi); letter-spacing: .06em; }
  .avg .lab { position: absolute; right: 18px; top: -38px; font-size: 18px; color: var(--nibi); opacity: 0; animation: fade .5s .6s ease forwards; }
  .avg .x { position: relative; }
  .avg .strike { position: absolute; left: -2px; top: 52%; height: 3px; width: 0; background: var(--shu); animation: strike .3s 3.9s ease-out forwards; }
  @keyframes strike { to { width: calc(100% + 4px); } }
  .fix { position: absolute; left: 380px; top: 344px; color: var(--shu); font-family: "Klee", "Hiragino Mincho ProN", serif; font-weight: 600; font-size: 27px;
    transform: rotate(-3deg); clip-path: inset(0 100% 0 0); animation: write .7s 4.2s steps(8, end) forwards, fade-out .5s 5.4s ease forwards; }
  @keyframes write { to { clip-path: inset(0 0 0 0); } }
</style></head>
<body>
<div class="avg">
  <p class="lab gothic">AIの案（平均的な答え）</p>
  <p class="h gothic">浜風運輸 配車課長 様</p>
  <p>改修の納期が、遅れる見込みです。</p>
  <p><span class="x">確定しだい、メールで<span class="strike"></span></span>ご連絡いたします。</p>
</div>
<p class="fix">早めに配車課長へ</p>
<div class="page"><div class="ledger" id="ledger">
  <div class="head">心得帳<small>だいだい工房</small></div>
</div></div>
<div id="said"></div>
<script>
  // [master's words, the rule it became] — from the demo kokoroe-chō (fictional)
  const E = [
    ["そこはいらん", "季節のあいさつは送らなくてよい。"],
    ["早めに配車課長へ", "悪い知らせは確定を待たず、早めに配車課長へ本題まで伝える。"],
    ["今は向こう忙しい", "2〜3月は依頼を受けたら受領の一言だけ先に返し、本題は落ち着いてから送る。"],
  ];
  const ledger = document.getElementById("ledger"), said = document.getElementById("said");
  E.forEach(([w, rule], i) => {
    const t = 6.0 + i * 1.2; // said → land → write
    const en = document.createElement("div");
    en.className = "entry";
    en.style.cssText = `--w:${(t + 0.95).toFixed(2)}s;--land:${(t + 1.15).toFixed(2)}s`;
    en.innerHTML = `<span class="note">「${w}」</span>${rule}`;
    ledger.appendChild(en);
    const s = document.createElement("div");
    s.className = "said"; s.textContent = `「${w}」`;
    s.style.cssText = `--s:${t.toFixed(2)}s;--f:${(t + 0.7).toFixed(2)}s;--sx:${230 - i * 4}px;--sy:150px`;
    said.appendChild(s);
  });
  // writing: each entry is revealed down its first column, then the next one to the left (a 6-point polygon per step)
  const COL = 38, PER_COL = 0.42;
  for (const en of document.querySelectorAll(".entry")) {
    const W = en.offsetWidth, H = en.offsetHeight, n = Math.round(W / COL), x = (k) => `${W - COL * k}px`;
    const poly = (k, d) => `polygon(${x(0)} 0, ${x(0)} ${H}px, ${x(k)} ${H}px, ${x(k)} ${d * H}px, ${x(k + 1)} ${d * H}px, ${x(k + 1)} 0)`;
    const frames = [];
    for (let k = 0; k < n; k++) {
      frames.push({ clipPath: poly(k, 0), offset: k / n, easing: "linear" }, { clipPath: poly(k, 1), offset: (k + 1) / n - 0.0001 });
    }
    frames.push({ clipPath: poly(n, 0), offset: 1 });
    const delay = parseFloat(getComputedStyle(en).getPropertyValue("--w")) * 1000;
    en.animate(frames, { delay, duration: n * PER_COL * 1000, fill: "both" });
  }
  // where each note sits (layout is fixed, so this is deterministic): the flying word lands exactly there
  for (const [i, n] of [...document.querySelectorAll(".entry .note")].entries()) {
    const r = n.getBoundingClientRect(), s = said.children[i];
    s.style.setProperty("--tx", `${r.left + (r.width - 34 * 0.53) / 2}px`);
    s.style.setProperty("--ty", `${r.top}px`);
  }
</script>
</body></html>
