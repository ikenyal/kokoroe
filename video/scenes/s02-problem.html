<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<!-- s02 (v6: the problem and what goes wrong, one scene; about 13.9 s. Kento 11/6 item 24: the first two sentences merged so the
     real screens come sooner; times below are estimates, set from the new narration's speech marks on 11/7). On the narration's sentences (+0.15 s lead):
     0.15 取引先ごとの伝え方、三十年分の作法は、部長の頭の中にしかありません。 → the director from behind, the client ledger;
          「誰に」「何を」「どう」, then the three words go into his head
     6.4  後任が、悪い知らせを、決まってからメールで送る。 → (phase B) the week on a line; the mail goes out on Thursday
     10.9 それだけで、長年の段取りが崩れます。          → 浜風運輸's switch-over plan comes apart
     (The cold open already says he retires next spring, so this scene no longer repeats it.)
     8.9 (on the mail going out) a measured note, Kento 11/5 night: of the 18 drafts the author passed ○ at first sight, 15 were
     ones the master would correct (code judge on the master-role test, D-059; docs/results/master-role-vs-simulator-2026-11-05.json).
     Clients are the fictional ones of data/world/clients.json. Colors: 墨 and 藍 only (no master in the room). -->
<style>
  .pa { animation: fade-out .5s 5.8s ease forwards; }
  .pb { opacity: 0; animation: fade .3s 6.1s ease forwards; }

  .person .draw { --t: 1.4s; }
  .who { position: absolute; left: 820px; top: 590px; width: 170px; text-align: center; font-size: 19px; color: var(--nibi); letter-spacing: .08em;
    opacity: 0; animation: fade .6s .5s ease forwards; }
  .book { opacity: 0; animation: fade .5s .3s ease forwards; }
  
  .name { position: absolute; top: 186px; writing-mode: vertical-rl; font-size: 25px; letter-spacing: .18em; line-height: 1;
    clip-path: inset(0 0 100% 0); animation: write .45s var(--d) steps(6, end) forwards; }
  @keyframes write { to { clip-path: inset(0 0 0 0); } }
  .q { position: absolute; top: 520px; font-size: 38px; color: var(--ai); letter-spacing: .1em; opacity: 0; transform-origin: center;
    animation: fade .5s var(--d) ease forwards, into 1.6s var(--m) cubic-bezier(.45,.05,.3,1) forwards; }
  @keyframes into { to { transform: translate(var(--dx), var(--dy)) scale(.48); } }
  .ring { opacity: 0; animation: fade 1s 4.8s ease forwards; }

  .axis { position: absolute; left: 110px; top: 156px; width: 520px; }
  .axis .line { position: absolute; left: 0; right: 0; top: 34px; height: 2px; background: var(--sumi); transform-origin: left; transform: scaleX(0);
    animation: grow .9s 6.2s ease forwards; }
  @keyframes grow { to { transform: scaleX(1); } }
  .day { position: absolute; top: 0; width: 80px; margin-left: -40px; text-align: center; font-size: 22px; opacity: 0; animation: fade .4s var(--d) ease forwards; }
  .tick { position: absolute; top: 28px; left: 50%; width: 2px; height: 14px; margin-left: -1px; background: var(--sumi); }
  .ev { position: absolute; top: 58px; width: 170px; margin-left: -85px; text-align: center; font-size: 18px; color: var(--nibi); line-height: 1.4;
    opacity: 0; animation: fade .5s var(--d) ease forwards; }
  .gap { position: absolute; top: 31px; height: 8px; border-top: 2px dashed var(--usuzumi); opacity: 0; animation: fade .5s 7.9s ease forwards; }
  .mail { position: absolute; left: 150px; top: 296px; width: 440px; padding: 18px 22px; background: #faf9f6; border: 1.5px solid var(--sumi);
    font-size: 19px; line-height: 1.7; opacity: 0; animation: fade .5s 8.4s ease forwards, send 1.0s 9.5s cubic-bezier(.5,0,.6,1) forwards; }
  .mail .h { font-size: 15px; color: var(--nibi); }
  @keyframes send { to { transform: translate(600px, 40px) scale(.3); opacity: 0; } }
  .board { position: absolute; left: 690px; top: 140px; width: 480px; opacity: 0; animation: fade .7s 6.8s ease forwards; }
  .board h2 { font-size: 21px; font-weight: 600; letter-spacing: .06em; }
  .board h2 small { font-size: 15px; font-weight: 400; color: var(--nibi); margin-left: 10px; }
  .grid { position: relative; margin-top: 12px; height: 300px; border-top: 2px solid var(--sumi); border-bottom: 2px solid var(--sumi);
    background: repeating-linear-gradient(to right, transparent 0 119px, var(--keisen) 119px 120px); }
  .col { position: absolute; top: 8px; width: 120px; text-align: center; font-size: 16px; color: var(--nibi); }
  .blk { position: absolute; height: 46px; padding: 10px 12px; font-size: 17px; line-height: 1.5; background: var(--kami-2); border: 1.5px solid var(--ai);
    color: var(--ai); transform-origin: var(--o, left bottom); animation: fall 1.3s var(--d) cubic-bezier(.55,0,.75,.6) forwards; }
  @keyframes fall { 30% { transform: rotate(var(--r)); } to { transform: translate(var(--x), var(--y)) rotate(calc(var(--r) * 2.4)); opacity: .25; } }
  .slot { position: absolute; height: 46px; border: 1.5px dashed var(--usuzumi); opacity: 0; animation: fade .6s var(--d) ease forwards; }
  .fact { position: absolute; left: 110px; right: 110px; top: 516px; padding-top: 14px; border-top: 1px solid var(--keisen);
    font-size: 23px; line-height: 1.6; letter-spacing: .03em; opacity: 0; animation: fade .6s 8.9s ease forwards; }
  .fact small { display: block; font-size: 16px; color: var(--nibi); letter-spacing: .04em; }
</style></head>
<body>
<p class="corner-note gothic">架空の会社・だいだい工房</p>
<div class="pa">

<svg width="1280" height="720" viewBox="0 0 1280 720" style="position:absolute;inset:0">
  <!-- the client ledger, open -->
  <g class="book">
    <path d="M150,150 H380 Q390,156 400,150 H630 V500 H400 Q390,506 380,500 H150 Z" fill="#faf9f6" stroke="var(--sumi)" stroke-width="2"/>
    <path class="ink thin" d="M390,154 V502"/>
  </g>
  <!-- the sales director, from behind (head, ears, collar, shoulders, arms) -->
  <g class="person">
    <ellipse class="ink draw" pathLength="1" style="--d:0s" cx="905" cy="250" rx="54" ry="64"/>
    <path class="ink draw" pathLength="1" style="--d:.2s" d="M851,246 Q842,252 849,266 M959,246 Q968,252 961,266"/>
    <path class="ink draw" pathLength="1" style="--d:.3s" d="M792,570 Q796,404 862,366 L884,318 Q905,330 926,318 L948,366 Q1014,404 1018,570"/>
    <path class="ink draw thin" pathLength="1" style="--d:.5s" d="M880,328 Q905,342 930,328 M905,342 V570 M840,430 Q830,500 834,570 M970,430 Q980,500 976,570"/>
    <path class="ink draw thin" pathLength="1" style="--d:.4s" d="M872,301 Q905,314 938,301"/>
  </g>
  <ellipse class="ring" cx="905" cy="250" rx="76" ry="86" fill="none" stroke="var(--ai)" stroke-width="1.4" stroke-dasharray="3 7"/>
</svg>
<p class="who gothic" style="left:975px;top:160px;width:auto">営業部長</p>
<div id="names"></div>
<p class="q" style="left:210px;--d:.6s;--m:3.6s;--dx:655px;--dy:-338px">誰に</p>
<p class="q" style="left:350px;--d:1.2s;--m:3.8s;--dx:515px;--dy:-308px">何を</p>
<p class="q" style="left:490px;--d:1.8s;--m:4.0s;--dx:375px;--dy:-278px">どう</p>
<script>
  // Clients from data/world/clients.json (fictional), right → left like a ledger; one column each, written in turn.
  const NAMES = ["浜風運輸", "白樺製菓", "港北精機", "丸新酒造", "県産業振興財団", "大河原建材", "青葉ドラッグ", "ネクストリンク"];
  const X = [580, 530, 480, 430, 340, 290, 240, 190];
  NAMES.forEach((n, i) => {
    const el = document.createElement("p");
    el.className = "name"; el.textContent = n;
    el.style.cssText = `left:${X[i] - 13}px;--d:${(0.4 + i * 0.12).toFixed(2)}s`;
    document.getElementById("names").appendChild(el);
  });
</script>
</div>
<div class="pb">

<div class="axis gothic">
  <div class="line"></div>
  <div class="gap" style="left:60px;width:330px"></div>
  <div class="day" style="left:60px;--d:6.4s">月<div class="tick"></div></div>
  <div class="day" style="left:170px;--d:6.6s">火<div class="tick"></div></div>
  <div class="day" style="left:280px;--d:6.7s">水<div class="tick"></div></div>
  <div class="day" style="left:390px;--d:6.8s">木<div class="tick"></div></div>
  <div class="ev" style="left:60px;--d:7.2s">納期の遅れが<br>分かる</div>
  <div class="ev" style="left:390px;--d:8.1s;color:var(--sumi)">遅れが決まる<br>→ メールを送る</div>
</div>
<div class="mail gothic">
  <p class="h">差出人：三上（後任）　宛先：浜風運輸 配車課長 様</p>
  <p>件名：配車システム改修の納期遅れについて</p>
  <p>本日、納期の変更が決まりましたので…</p>
</div>
<div class="board">
  <h2>浜風運輸の段取り<small>システム切り替えの週</small></h2>
  <div class="grid gothic">
    <div class="col" style="left:0">金</div><div class="col" style="left:120px">土</div><div class="col" style="left:240px">日</div><div class="col" style="left:360px">月</div>
    <div class="slot" style="left:8px;top:52px;width:224px;--d:11.8s"></div>
    <div class="slot" style="left:128px;top:128px;width:224px;--d:12.4s"></div>
    <div class="slot" style="left:248px;top:204px;width:224px;--d:13.0s"></div>
    <div class="blk" style="left:8px;top:52px;width:224px;--d:11.3s;--r:-4deg;--x:-30px;--y:140px">配車の組み直し</div>
    <div class="blk" style="left:128px;top:128px;width:224px;--d:11.9s;--r:5deg;--x:40px;--y:96px;--o:right bottom">ドライバー説明会</div>
    <div class="blk" style="left:248px;top:204px;width:224px;--d:12.5s;--r:-6deg;--x:-20px;--y:60px">旧システム停止</div>
  </div>
</div>
<p class="fact gothic">作者が初見で ○ を付けた18件のうち、15件は、師匠なら直す案でした。<small>架空のデータ・学習用の20場面。経緯を知らない作者が師匠役をし、シミュレータの判定では △ 8件・× 7件</small></p>

</div>
</body></html>
