<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<!-- s02 (v2 part 2, what goes wrong; 15.5 s). Timed to the narration's sentences (+0.3 s lead):
     0.3  後任が、悪い知らせを、決まってからメールで送ります。     → a week on a line: the delay is known on Monday, decided on
                                                                Thursday; only then the successor's mail goes out
     5.2  それだけで、長年の取引先との段取りが、崩れてしまいます。 → the client's switch-over plan (built around our delivery)
                                                                comes apart, block by block
     10.6 部長が昔、同じことで叱られたことは、誰も知りません。     → the old lesson appears faintly on a worn page, and fades
     The client and its dispatch manager are C01 浜風運輸 (data/world/clients.json); the lesson is the demo kokoroe-chō's K-015
     (early to the dispatch manager). Colors: 墨 and 藍 only — no 朱 (no master is in the room). -->
<style>
  .axis { position: absolute; left: 110px; top: 156px; width: 520px; }
  .axis .line { position: absolute; left: 0; right: 0; top: 34px; height: 2px; background: var(--sumi); transform-origin: left; transform: scaleX(0);
    animation: grow .9s .3s ease forwards; }
  @keyframes grow { to { transform: scaleX(1); } }
  .day { position: absolute; top: 0; width: 80px; margin-left: -40px; text-align: center; font-size: 22px; opacity: 0; animation: fade .4s var(--d) ease forwards; }
  .tick { position: absolute; top: 28px; left: 50%; width: 2px; height: 14px; margin-left: -1px; background: var(--sumi); }
  .ev { position: absolute; top: 58px; width: 170px; margin-left: -85px; text-align: center; font-size: 18px; color: var(--nibi); line-height: 1.4;
    opacity: 0; animation: fade .5s var(--d) ease forwards; }
  .gap { position: absolute; top: 31px; height: 8px; border-top: 2px dashed var(--usuzumi); opacity: 0; animation: fade .5s 2.0s ease forwards; }
  .mail { position: absolute; left: 150px; top: 296px; width: 440px; padding: 18px 22px; background: #faf9f6; border: 1.5px solid var(--sumi);
    font-size: 19px; line-height: 1.7; opacity: 0; animation: fade .5s 2.8s ease forwards, send 1.1s 4.1s cubic-bezier(.5,0,.6,1) forwards; }
  .mail .h { font-size: 15px; color: var(--nibi); }
  @keyframes send { to { transform: translate(600px, 40px) scale(.3); opacity: 0; } }
  .board { position: absolute; left: 690px; top: 140px; width: 480px; opacity: 0; animation: fade .7s 1.2s ease forwards; }
  .board h2 { font-size: 21px; font-weight: 600; letter-spacing: .06em; }
  .board h2 small { font-size: 15px; font-weight: 400; color: var(--nibi); margin-left: 10px; }
  .grid { position: relative; margin-top: 12px; height: 300px; border-top: 2px solid var(--sumi); border-bottom: 2px solid var(--sumi);
    background: repeating-linear-gradient(to right, transparent 0 119px, var(--keisen) 119px 120px); }
  .col { position: absolute; top: 8px; width: 120px; text-align: center; font-size: 16px; color: var(--nibi); }
  .blk { position: absolute; height: 46px; padding: 10px 12px; font-size: 17px; line-height: 1.5; background: var(--kami-2); border: 1.5px solid var(--ai);
    color: var(--ai); transform-origin: var(--o, left bottom); animation: fall 1.3s var(--d) cubic-bezier(.55,0,.75,.6) forwards; }
  @keyframes fall { 30% { transform: rotate(var(--r)); } to { transform: translate(var(--x), var(--y)) rotate(calc(var(--r) * 2.4)); opacity: .25; } }
  .slot { position: absolute; height: 46px; border: 1.5px dashed var(--usuzumi); opacity: 0; animation: fade .6s var(--d) ease forwards; }
  .memo { position: absolute; left: 330px; top: 500px; width: 620px; padding: 16px 26px; text-align: center; background: #efe9dc;
    border: 1px solid #d8cfbb; font-size: 21px; line-height: 1.6; color: #6f675a; opacity: 0;
    animation: memo 4.4s 10.7s ease forwards; }
  .memo small { display: block; font-size: 14px; letter-spacing: .1em; }
  @keyframes memo { 0% { opacity: 0; filter: blur(2px); } 25% { opacity: .85; filter: blur(0); } 60% { opacity: .75; filter: blur(0); }
    100% { opacity: 0; filter: blur(3px); transform: translateY(8px); } }
</style></head>
<body>
<p class="corner-note gothic">架空の会社・だいだい工房</p>
<div class="axis gothic">
  <div class="line"></div>
  <div class="gap" style="left:60px;width:330px"></div>
  <div class="day" style="left:60px;--d:.5s">月<div class="tick"></div></div>
  <div class="day" style="left:170px;--d:.65s">火<div class="tick"></div></div>
  <div class="day" style="left:280px;--d:.8s">水<div class="tick"></div></div>
  <div class="day" style="left:390px;--d:.95s">木<div class="tick"></div></div>
  <div class="ev" style="left:60px;--d:1.3s">納期の遅れが<br>分かる</div>
  <div class="ev" style="left:390px;--d:2.2s;color:var(--sumi)">遅れが決まる<br>→ メールを送る</div>
</div>
<div class="mail gothic">
  <p class="h">差出人：三上（後任）　宛先：浜風運輸 配車課長 様</p>
  <p>件名：配車システム改修の納期遅れについて</p>
  <p>本日、納期の変更が決まりましたので…</p>
</div>
<div class="board">
  <h2>浜風運輸の段取り<small>システム切り替えの週</small></h2>
  <div class="grid gothic">
    <div class="col" style="left:0">金</div><div class="col" style="left:120px">土</div><div class="col" style="left:240px">日</div><div class="col" style="left:360px">月</div>
    <div class="slot" style="left:8px;top:52px;width:224px;--d:5.9s"></div>
    <div class="slot" style="left:128px;top:128px;width:224px;--d:6.5s"></div>
    <div class="slot" style="left:248px;top:204px;width:224px;--d:7.1s"></div>
    <div class="blk" style="left:8px;top:52px;width:224px;--d:5.4s;--r:-4deg;--x:-30px;--y:140px">配車の組み直し</div>
    <div class="blk" style="left:128px;top:128px;width:224px;--d:6.0s;--r:5deg;--x:40px;--y:96px;--o:right bottom">ドライバー説明会</div>
    <div class="blk" style="left:248px;top:204px;width:224px;--d:6.6s;--r:-6deg;--x:-20px;--y:60px">旧システム停止</div>
  </div>
</div>
<div class="memo">
  <small>（誰も知らない、昔の話）</small>
  悪い知らせは、決まる前に、配車課長へ。——部長が若いころ、浜風運輸で叱られて覚えたこと
</div>
</body></html>
